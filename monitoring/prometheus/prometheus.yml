global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: kafka_exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: consumer_client
    static_configs:
      - targets: ["host.docker.internal:9464"]

  - job_name: dlq_retry_client
    static_configs:
      - targets: ["host.docker.internal:9465"]

  - job_name: hbase_metrics_exporter
    static_configs:
      - targets: ["host.docker.internal:9466"]
